# Checks every pull request and every push to main (spec 003, User Story 1).
# Job names are required status checks in .github/rulesets/main.json: rename them together.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        id: build
        uses: ./.github/actions/build-test
        with:
          version: 0.0.0-ci.${{ github.run_number }}
          export-ext4: 'true'

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hddbackup-exe
          path: |
            ${{ steps.build.outputs.exe-dir }}/HddBackup.exe
            ${{ steps.build.outputs.exe-dir }}/HddBackup.exe.config
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/results.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exported ext4 images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ext4-exports
          path: ${{ steps.build.outputs.exports-dir }}
          if-no-files-found: error
          retention-days: 1

  ext4-check:
    name: ext4-check
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (fixtures and check scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exported ext4 images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ext4-exports
          path: ${{ runner.temp }}/ext4-exports

      - name: Install e2fsprogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs dosfstools fdisk

      - name: Check every image with e2fsck and a tree comparison
        run: tools/ci/Invoke-Ext4Checks.sh "$RUNNER_TEMP/ext4-exports" tests/HddBackup.Core.Tests/Fixtures/ext4
