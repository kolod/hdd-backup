# Builds a pushed version tag and creates a DRAFT GitHub release (spec 003, User Story 2).
# The maintainer publishes the draft after the manual hardware checklist (docs/releasing.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      numeric_version: ${{ steps.tag.outputs.numeric_version }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Checkout (full history for the on-main check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag format and commit on main
        id: tag
        shell: pwsh
        run: ./tools/release/Test-ReleaseTag.ps1 -Tag '${{ github.ref_name }}' -MainRef origin/main

      - name: Release notes section exists
        shell: pwsh
        run: ./tools/release/Get-ReleaseNotes.ps1 -Version '${{ steps.tag.outputs.version }}' | Out-Null

      - name: No release exists for this tag yet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json isDraft 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::A release for ${{ github.ref_name }} already exists (draft or published). Releases are never overwritten; use a new version."
            exit 1
          }
          if ("$out" -notmatch 'release not found') {
            Write-Host "::error::Could not check existing releases: $out"
            exit 1
          }
          exit 0

  build:
    name: build
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        id: build
        uses: ./.github/actions/build-test
        with:
          version: ${{ needs.validate.outputs.version }}
          export-ext4: 'false'

      - name: Check stamped version
        shell: pwsh
        run: |
          $exe = Join-Path '${{ steps.build.outputs.exe-dir }}' 'HddBackup.exe'
          $info = (Get-Item $exe).VersionInfo
          "File version: $($info.FileVersion); product version: $($info.ProductVersion)"
          if (-not $info.FileVersion.StartsWith('${{ needs.validate.outputs.numeric_version }}')) {
            Write-Host "::error::Executable version $($info.FileVersion) does not match the tag."
            exit 1
          }

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            ${{ steps.build.outputs.exe-dir }}/HddBackup.exe
            ${{ steps.build.outputs.exe-dir }}/HddBackup.exe.config
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the only job allowed to write (FR-015)
    steps:
      - name: Checkout tag (scripts and release notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/files

      - name: Release text and checksums
        shell: pwsh
        run: ./tools/release/New-ReleaseBody.ps1 -Version '${{ needs.validate.outputs.version }}' -FilesDir '${{ runner.temp }}/files' -OutDir '${{ runner.temp }}/out'

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Join-Path '${{ runner.temp }}' 'files'
          $out = Join-Path '${{ runner.temp }}' 'out'
          $ghArgs = @(
            'release', 'create', '${{ github.ref_name }}',
            '--repo', '${{ github.repository }}',
            '--draft', '--verify-tag',
            '--title', 'HddBackup ${{ needs.validate.outputs.version }}',
            '--notes-file', (Join-Path $out 'body.md')
          )
          if ('${{ needs.validate.outputs.is_prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          $ghArgs += (Join-Path $files 'HddBackup.exe'), (Join-Path $files 'HddBackup.exe.config'), (Join-Path $out 'SHA256SUMS')
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "### Draft release created" >> $env:GITHUB_STEP_SUMMARY
          "Publish it after the hardware checklist: ${{ github.server_url }}/${{ github.repository }}/releases" >> $env:GITHUB_STEP_SUMMARY
